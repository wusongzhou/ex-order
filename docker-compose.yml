services:
  supply-order:
    build: .
    container_name: supply-order
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Shanghai
      # 部署前务必修改以下两项
      - ADMIN_PASSWORD=admin123
      - SESSION_SECRET=please-change-me-to-a-long-random-string
    volumes:
      - supply-data:/app/data
    restart: unless-stopped

volumes:
  supply-data:
