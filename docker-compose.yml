services:
  ex-order:
    build: .
    container_name: ex-order
    ports:
      # 宿主机端口改为高位冷门端口，降低被扫描概率；容器内部仍是 3000
      - "49632:3000"
    environment:
      - TZ=Asia/Shanghai
      # 部署前务必修改以下两项
      - ADMIN_PASSWORD=admin123
      - SESSION_SECRET=please-change-me-to-a-long-random-string
    volumes:
      - supply-data:/app/data
    restart: unless-stopped

volumes:
  supply-data:
