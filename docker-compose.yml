services:
  ex-order:
    build: .
    container_name: ex-order
    ports:
      # 宿主机与容器统一使用 49632，避开 3000（宿主机 3000 另有他用）
      - "49632:49632"
    environment:
      - TZ=Asia/Shanghai
      - PORT=49632
      # 部署前务必修改以下两项
      - ADMIN_PASSWORD=admin123
      - SESSION_SECRET=please-change-me-to-a-long-random-string
    volumes:
      - ex-order-data:/app/data
    restart: unless-stopped

volumes:
  ex-order-data:
